[project]
name = "grd-fingerprinting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emma Marshall", email = "e.marshall.111@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "dask>=2026.8.0",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "scipy>=1.18.1",
    "xarray>=2026.7.0",
]

[project.scripts]
grd-fingerprinting = "grd_fingerprinting.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
]
